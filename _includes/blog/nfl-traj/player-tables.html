<style>
.player-tables{font-family:'Lato',sans-serif;max-width:760px;margin:0 auto}
.player-tables h3{font-size:15px;margin:28px 0 8px;font-weight:700}
.player-tables table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.player-tables th{text-align:left;padding:6px 8px;border-bottom:2px solid #333;font-weight:700;font-size:12px;white-space:nowrap}
.player-tables td{padding:5px 8px;border-bottom:1px solid #eee;white-space:nowrap}
.player-tables .desc{white-space:normal;font-size:11.5px;color:#555;max-width:180px;line-height:1.3}
.player-tables tr:hover{background:#f8f8f8}
.player-tables .num{text-align:right;font-variant-numeric:tabular-nums}
.player-tables .rank{color:#999;font-size:12px}
.player-tables .name{font-weight:600}
.player-tables .pos{color:#888;font-size:11px}
.player-tables .arrow{font-size:10px;color:#999;font-weight:400}
</style>
<div class="player-tables">
<h3>Top 10 Wide Receivers by Route Deviation</h3>
<table id="wr-table"></table>
<figcaption style="font-size:12px;color:#888;font-style:italic;margin-top:2px;">
  <b>ADE</b>: mean trajectory prediction error (yards) when this WR is targeted, from model inference at K=10.
  <b>Comp/Incomp</b>: ADE split by play outcome (pass_result = C vs I from NFL tracking data).
  <b>C%</b>: completion rate when targeted = completions / (completions + incompletions); excludes interceptions.
  <b>EPA</b>: expected points added per play from NFL play-by-play data (supplementary_data.csv).
  <b>YPP</b>: yards gained per play from play-by-play. <b>N</b>: total targeted plays (min 20).
</figcaption>

<h3>Top 10 Cornerbacks by Route Deviation</h3>
<table id="cb-table"></table>
<figcaption style="font-size:12px;color:#888;font-style:italic;margin-top:2px;">
  Same columns, but from the CB's coverage perspective. <b>ADE</b>: how much the covered receiver deviated.
  <b>C%</b>: completion rate of passes into this CB's coverage (lower = better).
  <b>EPA/YPP</b>: offensive EPA and yards allowed on plays where this CB is the coverage target (lower = better).
</figcaption>
</div>

<script>
(function(){
  var wrs = [
    {rank:1,name:"Parris Campbell",team:"NYG",ade:47.5,comp:47.0,incomp:42.9,cr:0.80,epa:-0.888,ypp:4.2,n:21},
    {rank:2,name:"Kadarius Toney",team:"KC",ade:40.7,comp:40.5,incomp:40.6,cr:0.64,epa:-0.228,ypp:5.2,n:24},
    {rank:3,name:"Kalif Raymond",team:"DET",ade:39.8,comp:39.9,incomp:39.5,cr:0.76,epa:0.661,ypp:11.2,n:33},
    {rank:4,name:"Rashee Rice",team:"KC",ade:39.7,comp:42.1,incomp:33.4,cr:0.75,epa:0.401,ypp:10.4,n:74},
    {rank:5,name:"Josh Downs",team:"IND",ade:39.1,comp:40.3,incomp:37.0,cr:0.72,epa:0.291,ypp:8.5,n:81},
    {rank:6,name:"Hunter Renfrow",team:"LV",ade:38.8,comp:42.1,incomp:33.3,cr:0.62,epa:0.124,ypp:7.7,n:29},
    {rank:7,name:"Trenton Irwin",team:"CIN",ade:38.7,comp:41.2,incomp:30.2,cr:0.85,epa:0.538,ypp:10.9,n:28},
    {rank:8,name:"Curtis Samuel",team:"WAS",ade:38.6,comp:38.2,incomp:38.7,cr:0.74,epa:0.139,ypp:7.6,n:69},
    {rank:9,name:"Skyy Moore",team:"KC",ade:38.5,comp:41.0,incomp:35.2,cr:0.61,epa:-0.238,ypp:6.9,n:30},
    {rank:10,name:"Deebo Samuel Sr.",team:"SF",ade:38.4,comp:36.8,incomp:42.0,cr:0.67,epa:0.495,ypp:10.5,n:67}
  ];

  var cbs = [
    {rank:1,name:"Bradley Roby",team:"PHI",ade:39.5,comp:40.9,incomp:37.6,cr:0.59,epa:0.261,ypp:6.5,n:51},
    {rank:2,name:"Jack Jones",team:"LV",ade:37.2,comp:41.7,incomp:27.7,cr:0.66,epa:0.395,ypp:9.4,n:61},
    {rank:3,name:"Jaire Alexander",team:"GB",ade:37.1,comp:38.1,incomp:34.4,cr:0.77,epa:0.656,ypp:11.4,n:58},
    {rank:4,name:"Jaylon Jones",team:"CHI",ade:36.7,comp:38.4,incomp:33.9,cr:0.62,epa:0.173,ypp:9.1,n:24},
    {rank:5,name:"Tre Avery",team:"TEN",ade:36.5,comp:39.5,incomp:28.3,cr:0.71,epa:0.502,ypp:8.2,n:56},
    {rank:6,name:"Devon Witherspoon",team:"SEA",ade:36.5,comp:40.8,incomp:29.6,cr:0.61,epa:0.053,ypp:6.9,n:114},
    {rank:7,name:"Starling Thomas V",team:"ARI",ade:35.7,comp:36.6,incomp:31.3,cr:0.83,epa:0.681,ypp:11.7,n:52},
    {rank:8,name:"Chandon Sullivan",team:"PIT",ade:35.0,comp:36.0,incomp:33.9,cr:0.67,epa:0.163,ypp:7.6,n:60},
    {rank:9,name:"Josh Jobe",team:"PHI",ade:34.9,comp:38.4,incomp:29.8,cr:0.60,epa:0.306,ypp:7.1,n:40},
    {rank:10,name:"Andrew Booth",team:"MIN",ade:34.8,comp:36.8,incomp:29.6,cr:0.71,epa:0.428,ypp:7.9,n:21}
  ];

  function lerpColor(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
  }

  var red = [220,60,60], green = [40,160,70], white = [255,255,255];

  function colorScale(v, minV, maxV, lowColor, highColor) {
    var t = (v - minV) / Math.max(maxV - minV, 0.01);
    return lerpColor(lowColor, highColor, t);
  }

  function divergingColor(v, minV, maxV, negColor, posColor) {
    if (v >= 0) return lerpColor(white, posColor, v / Math.max(maxV, 0.01));
    return lerpColor(white, negColor, -v / Math.max(-minV, 0.01));
  }

  function buildTable(tableId, data, isDefense) {
    var table = document.getElementById(tableId);
    var epaVals = data.map(function(d){return d.epa;});
    var epaMin = Math.min.apply(null, epaVals);
    var epaMax = Math.max.apply(null, epaVals);
    var compVals = data.map(function(d){return d.comp;});
    var compMin = Math.min.apply(null, compVals);
    var compMax = Math.max.apply(null, compVals);
    var incompVals = data.map(function(d){return d.incomp;});
    var incompMin = Math.min.apply(null, incompVals);
    var incompMax = Math.max.apply(null, incompVals);
    var adeVals = data.map(function(d){return d.ade;});
    var adeMin = Math.min.apply(null, adeVals);
    var adeMax = Math.max.apply(null, adeVals);
    var crVals = data.map(function(d){return d.cr;});
    var crMin = Math.min.apply(null, crVals);
    var crMax = Math.max.apply(null, crVals);
    var yppVals = data.map(function(d){return d.ypp;});
    var yppMin = Math.min.apply(null, yppVals);
    var yppMax = Math.max.apply(null, yppVals);

    // Column headers with arrows showing "good" direction
    var epaArrow = isDefense ? ' <span class="arrow">↓ better</span>' : ' <span class="arrow">↑ better</span>';
    var compArrow = isDefense ? ' <span class="arrow">↓</span>' : ' <span class="arrow">↑</span>';
    var incompArrow = isDefense ? ' <span class="arrow">↑</span>' : ' <span class="arrow">↓</span>';
    var crArrow = isDefense ? ' <span class="arrow">↓</span>' : ' <span class="arrow">↑</span>';
    var yppArrow = isDefense ? ' <span class="arrow">↓</span>' : ' <span class="arrow">↑</span>';

    var html = '<thead><tr>';
    html += '<th class="rank">#</th><th>Player</th><th>Team</th>';
    html += '<th class="num">ADE</th>';
    html += '<th class="num">Comp'+compArrow+'</th>';
    html += '<th class="num">Incomp'+incompArrow+'</th>';
    html += '<th class="num">C%'+crArrow+'</th>';
    html += '<th class="num">EPA'+epaArrow+'</th>';
    html += '<th class="num">YPP'+yppArrow+'</th><th class="num">N</th>';
    html += '</tr></thead><tbody>';

    for (var i = 0; i < data.length; i++) {
      var d = data[i];

      // ADE: higher = more deviation → blue gradient (neutral, neither good nor bad)
      var blue = [30,100,200];
      var ac = colorScale(d.ade, adeMin, adeMax, white, blue);
      // For WRs: high comp ADE = unusual routes that get caught = green; high incomp ADE = broken plays = red
      // For CBs: FLIP — high comp ADE = receivers caught on unusual routes against you = red (bad);
      //          high incomp ADE = receivers deviated but didn't catch = green (good)
      var cc, ic;
      if (isDefense) {
        cc = colorScale(d.comp, compMin, compMax, white, red);
        ic = colorScale(d.incomp, incompMin, incompMax, white, green);
      } else {
        cc = colorScale(d.comp, compMin, compMax, white, green);
        ic = colorScale(d.incomp, incompMin, incompMax, white, red);
      }
      // EPA: for WRs positive=green/negative=red; for CBs FLIP (low EPA = good for defense)
      var ec;
      if (isDefense) {
        ec = divergingColor(-d.epa, -epaMax, -epaMin, red, green);
      } else {
        ec = divergingColor(d.epa, epaMin, epaMax, red, green);
      }
      // C%: diverging from midpoint — white at middle, green toward "good", red toward "bad"
      var crMid = (crMin + crMax) / 2;
      var crc;
      if (isDefense) {
        // lower = better for CB
        crc = d.cr <= crMid ? colorScale(d.cr, crMin, crMid, green, white) : colorScale(d.cr, crMid, crMax, white, red);
      } else {
        crc = d.cr >= crMid ? colorScale(d.cr, crMid, crMax, white, green) : colorScale(d.cr, crMin, crMid, red, white);
      }
      // YPP: same diverging approach
      var yppMid = (yppMin + yppMax) / 2;
      var yc;
      if (isDefense) {
        yc = d.ypp <= yppMid ? colorScale(d.ypp, yppMin, yppMid, green, white) : colorScale(d.ypp, yppMid, yppMax, white, red);
      } else {
        yc = d.ypp >= yppMid ? colorScale(d.ypp, yppMid, yppMax, white, green) : colorScale(d.ypp, yppMin, yppMid, red, white);
      }

      html += '<tr>';
      html += '<td class="rank num">'+d.rank+'</td>';
      html += '<td class="name">'+d.name+'</td>';
      html += '<td class="pos">'+d.team+'</td>';
      html += '<td class="num" style="background:'+ac+'">'+d.ade.toFixed(1)+'</td>';
      html += '<td class="num" style="background:'+cc+'">'+d.comp.toFixed(1)+'</td>';
      html += '<td class="num" style="background:'+ic+'">'+d.incomp.toFixed(1)+'</td>';
      html += '<td class="num" style="background:'+crc+'">'+(d.cr*100).toFixed(0)+'%</td>';
      html += '<td class="num" style="background:'+ec+'">'+d.epa.toFixed(3)+'</td>';
      html += '<td class="num" style="background:'+yc+'">'+d.ypp.toFixed(1)+'</td>';
      html += '<td class="num">'+d.n+'</td>';
      html += '</tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
  }

  buildTable('wr-table', wrs, false);
  buildTable('cb-table', cbs, true);
})();
</script>
