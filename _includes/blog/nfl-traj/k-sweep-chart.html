<div id="k-sweep-chart" style="width:100%;max-width:700px;margin:24px auto;"></div>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<script>
(function() {
  var K = [1, 3, 5, 10, 15, 20, 25, 30];

  var traces = [
    {
      x: K, y: [10.30, 9.92, 9.39, 8.48, 7.49, 6.53, 5.70, 5.14],
      name: 'baseline (128d, 3+3)',
      line: {color: '#c0392b', width: 2},
      mode: 'lines+markers', marker: {size: 5}
    },
    {
      x: K, y: [7.82, 7.56, 7.22, 6.44, 5.71, 5.07, 4.63, 4.37],
      name: 'large-deep (256d, 4+4)',
      line: {color: '#8e44ad', width: 2},
      mode: 'lines+markers', marker: {size: 5}
    },
    {
      x: K, y: [7.78, 7.64, 7.41, 6.67, 5.84, 5.01, 4.40, 4.09],
      name: 'best: RoPE + mirror + Huber',
      line: {color: '#2ea043', width: 3},
      mode: 'lines+markers', marker: {size: 6}
    },
    {
      x: K, y: [7.77, 7.62, 7.46, 6.75, 5.98, 5.25, 4.64, 4.30],
      name: 'conv + mirror + Huber',
      line: {color: '#f09228', width: 2},
      mode: 'lines+markers', marker: {size: 5}
    }
  ];

  var layout = {
    title: {text: 'Error Decreases as the Model Sees More of the Play', font: {family: 'Lato, sans-serif', size: 15}},
    xaxis: {title: 'K (frames observed after snap)', dtick: 5, gridcolor: '#eee'},
    yaxis: {title: 'ADE (yards)', gridcolor: '#eee', autorange: 'reversed'},
    legend: {x: 0.02, y: 0.02, font: {size: 11}},
    margin: {l: 60, r: 20, t: 50, b: 50},
    plot_bgcolor: 'white',
    paper_bgcolor: 'white',
    hovermode: 'x unified',
    font: {family: 'Lato, sans-serif'}
  };

  Plotly.newPlot('k-sweep-chart', traces, layout, {responsive: true, displayModeBar: false});
})();
</script>
<figcaption style="text-align:center;font-family:'Lato',sans-serif;font-size:13px;color:#666;font-style:italic;margin-top:4px;">
  K=1 is the snap frame — formation only. K=15 is 1.5 seconds of play. The steepest drop is between the snap and the route break; after that, the model is mostly tracking momentum.
</figcaption>
