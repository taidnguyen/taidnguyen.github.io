<div class="diagram">
<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" style="max-width:680px;font-family:'Lato',sans-serif;">

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Position Encoding Comparison</text>

  <!-- Left: Sinusoidal -->
  <rect x="20" y="38" width="310" height="220" rx="6" fill="#fff5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="175" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Sinusoidal (Additive)</text>

  <!-- Tokens with PE added -->
  <rect x="50" y="72" width="60" height="24" rx="3" fill="#e8f4fd" stroke="#1772d0" stroke-width="1"/>
  <text x="80" y="88" text-anchor="middle" font-size="10" fill="#1772d0">frame 0</text>
  <text x="80" y="104" text-anchor="middle" font-size="9" fill="#c0392b">+ PE(0)</text>

  <rect x="130" y="72" width="60" height="24" rx="3" fill="#e8f4fd" stroke="#1772d0" stroke-width="1"/>
  <text x="160" y="88" text-anchor="middle" font-size="10" fill="#1772d0">frame 1</text>
  <text x="160" y="104" text-anchor="middle" font-size="9" fill="#c0392b">+ PE(1)</text>

  <rect x="210" y="72" width="60" height="24" rx="3" fill="#e8f4fd" stroke="#1772d0" stroke-width="1"/>
  <text x="240" y="88" text-anchor="middle" font-size="10" fill="#1772d0">frame 2</text>
  <text x="240" y="104" text-anchor="middle" font-size="9" fill="#c0392b">+ PE(2)</text>

  <!-- Description -->
  <text x="175" y="130" text-anchor="middle" font-size="11" fill="#555">Absolute identity: "I am frame t"</text>
  <text x="175" y="148" text-anchor="middle" font-size="11" fill="#555">Added to token before attention</text>
  <text x="175" y="166" text-anchor="middle" font-size="11" fill="#555">Distance must be inferred by model</text>

  <!-- Attention arrow showing absolute pos -->
  <text x="100" y="195" text-anchor="middle" font-size="10" fill="#888">attention(q+PE(0), k+PE(2))</text>
  <text x="175" y="212" text-anchor="middle" font-size="10" fill="#888">= f(content, abs_pos_0, abs_pos_2)</text>
  <text x="175" y="240" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">Encodes: "what" + "where"</text>

  <!-- Right: RoPE -->
  <rect x="350" y="38" width="310" height="220" rx="6" fill="#f0f7ff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="505" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#1772d0">RoPE (Rotary)</text>

  <!-- Tokens with rotation -->
  <rect x="380" y="72" width="60" height="24" rx="3" fill="#e8f4fd" stroke="#1772d0" stroke-width="1"/>
  <text x="410" y="88" text-anchor="middle" font-size="10" fill="#1772d0">frame 0</text>
  <text x="410" y="104" text-anchor="middle" font-size="9" fill="#1772d0">R(0) x q</text>

  <rect x="460" y="72" width="60" height="24" rx="3" fill="#e8f4fd" stroke="#1772d0" stroke-width="1"/>
  <text x="490" y="88" text-anchor="middle" font-size="10" fill="#1772d0">frame 1</text>
  <text x="490" y="104" text-anchor="middle" font-size="9" fill="#1772d0">R(1) x q</text>

  <rect x="540" y="72" width="60" height="24" rx="3" fill="#e8f4fd" stroke="#1772d0" stroke-width="1"/>
  <text x="570" y="88" text-anchor="middle" font-size="10" fill="#1772d0">frame 2</text>
  <text x="570" y="104" text-anchor="middle" font-size="9" fill="#1772d0">R(2) x q</text>

  <!-- Description -->
  <text x="505" y="130" text-anchor="middle" font-size="11" fill="#555">Relative distance: "I am 2 apart"</text>
  <text x="505" y="148" text-anchor="middle" font-size="11" fill="#555">Rotates Q and K before dot product</text>
  <text x="505" y="166" text-anchor="middle" font-size="11" fill="#555">Distance is in the attention itself</text>

  <!-- Attention arrow showing relative -->
  <text x="505" y="195" text-anchor="middle" font-size="10" fill="#888">attention(R(0)q, R(2)k)</text>
  <text x="505" y="212" text-anchor="middle" font-size="10" fill="#888">= f(content, relative_dist=2)</text>
  <text x="505" y="240" text-anchor="middle" font-size="12" fill="#1772d0" font-weight="600">Encodes: "what" + "how far"</text>

</svg>
<div class="diagram-caption">Sinusoidal PE adds a fixed position vector to each token. RoPE rotates Q and K so the dot product inherently encodes relative distance.</div>
</div>
